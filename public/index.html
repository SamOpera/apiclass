<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Environment Loader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0b0a;
      --panel: #141210;
      --line: #2a2520;
      --gold: #c9a961;
      --gold-soft: rgba(201, 169, 97, 0.12);
      --text: #f2ede4;
      --muted: #8f877a;
      --ok: #7fb58a;
      --bad: #d07a6a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, rgba(201,169,97,0.08), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .wrap { width: 100%; max-width: 640px; }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }
    h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      font-size: clamp(38px, 6vw, 54px);
      line-height: 1.05;
      margin-bottom: 12px;
    }
    .sub { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 40px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: border-color .25s;
    }
    .card:hover { border-color: rgba(201,169,97,0.4); }
    .key {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
    .dot.bad { background: var(--bad); }
    .val {
      font-family: "JetBrains Mono", monospace;
      font-size: 18px;
      word-break: break-all;
    }
    button {
      background: var(--gold-soft);
      color: var(--gold);
      border: 1px solid rgba(201,169,97,0.3);
      border-radius: 999px;
      padding: 8px 16px;
      font: 500 12px "Inter", sans-serif;
      letter-spacing: 0.06em;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s;
    }
    button:hover { background: rgba(201,169,97,0.22); }
    .foot { margin-top: 28px; font-size: 12px; color: var(--muted); }
    .foot code { font-family: "JetBrains Mono", monospace; color: var(--gold); }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Environment</p>
    <h1>Variables loaded from .env</h1>
    <p class="sub">These values are read by the server from the <code>.env</code> file and sent to this page through <code>/api/env</code>.</p>

    <div id="list"></div>

    <p class="foot" id="status">Loading...</p>
  </main>

  <script>
    const KEYS = ["TESTING", "KUNLE_API"];

    function mask(v) { return "•".repeat(Math.min(v.length, 18)); }

    function renderCard(name, value) {
      const loaded = value !== null && value !== "";
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div>' +
          '<div class="key"><span class="dot ' + (loaded ? "ok" : "bad") + '"></span>' + name + '</div>' +
          '<div class="val">' + (loaded ? mask(value) : "Not set") + '</div>' +
        '</div>';

      if (loaded) {
        let shown = false;
        const btn = document.createElement("button");
        btn.textContent = "Reveal";
        btn.addEventListener("click", function () {
          shown = !shown;
          card.querySelector(".val").textContent = shown ? value : mask(value);
          btn.textContent = shown ? "Hide" : "Reveal";
        });
        card.appendChild(btn);
      }
      return card;
    }

    fetch("/api/env")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        const list = document.getElementById("list");
        let count = 0;
        KEYS.forEach(function (k) {
          list.appendChild(renderCard(k, data[k]));
          if (data[k]) count++;
        });
        document.getElementById("status").innerHTML =
          count + " of " + KEYS.length + " variables loaded from <code>.env</code>";
      })
      .catch(function () {
        document.getElementById("status").textContent =
          "Could not reach the server. Start it with: npm start";
      });
  </script>
</body>
</html>
